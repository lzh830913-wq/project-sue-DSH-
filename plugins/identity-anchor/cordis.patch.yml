# ============================================================================
# @sue/identity-anchor —— DSH bundle patch
# ============================================================================
# 只插入一个纯 Host 插件行：没有 client 半区、没有额外进程、没有定时器。
#
# 它的唯一职责：在系统提示词的 order -99 处贡献一段「我是苏静雯」，
# 排在框架身份（-100）之后、人格文件（0）之前。
#
# 关闭方式：插件管理里禁用 identity-anchor 这一行（Cordis 会卸载它贡献的段）。
# ============================================================================

- insert:
    - id: identity-anchor
      name: '@sue/identity-anchor'
